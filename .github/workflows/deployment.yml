name: Deployment

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deployment.yml'
  workflow_dispatch:

  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/deployment.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        working-directory: backend
        run: dotnet test QuotationPortal.slnx -c Release

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'production' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and target
        id: v
        run: |
          VERSION=$(tr -d '[:space:]' < backend/sem.ver)
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-RC[0-9]+$ ]]; then
            KIND=rc
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            KIND=stable
          else
            echo "::error::backend/sem.ver must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-RC<number> (found '$VERSION')"
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "production" ]; then
            RAILWAY_ENV=production
            if [ "$KIND" != "stable" ]; then
              echo "::error::Release candidates ('$VERSION') cannot be deployed to production."
              exit 1
            fi
          else
            RAILWAY_ENV=development
          fi

          TAG_EXISTS=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            TAG_EXISTS=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "railway_env=$RAILWAY_ENV" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: steps.v.outputs.kind == 'rc' || steps.v.outputs.tag_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/quotation-portal-api:${{ steps.v.outputs.version }}

      - name: Create tag and GitHub release
        if: steps.v.outputs.kind == 'stable' && steps.v.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --generate-notes --title "v${{ steps.v.outputs.version }}"
